<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CareConnect — View patients</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="dashboard" class="dashboard">
    <header class="dash-header">
      <div class="dash-brand">
        <span class="logo-mark small" aria-hidden="true">
          <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="currentColor" opacity="0.15"/><path d="M24 12v24M12 24h24" stroke="currentColor" stroke-width="3.5" stroke-linecap="round"/></svg>
        </span>
        <span>CareConnect</span>
      </div>
      <div class="dash-actions">
        <button type="button" id="btn-logout" class="logout-btn">Log out</button>
      </div>
    </header>

    <nav class="dash-nav" aria-label="Caregiver navigation">
      <a href="dashboard.html" class="dash-nav-link">Dashboard</a>
      <a href="patients.html" class="dash-nav-link active" aria-current="page">View patients</a>
      <a href="onboard-patient.html" class="dash-nav-link">Add patient</a>
      <a href="apis.html" class="dash-nav-link">APIs</a>
    </nav>

    <main class="dash-main dash-main-wide">
      <header class="dash-section-header">
        <div>
          <p class="eyebrow">Patient overview</p>
          <h2>View patients</h2>
          <p class="dash-subtitle">Medication counts and recent check-in status for each patient.</p>
        </div>
      </header>

      <div id="patients-list" class="patients-list"></div>
      <p id="patients-empty" class="empty-state hidden">
        No patients linked yet.
        <a href="onboard-patient.html">Add a patient</a>
      </p>

      <div id="page-message" class="message" role="status"></div>
    </main>
  </div>

  <script src="common.js"></script>
  <script src="patients.js"></script>
</body>
</html>
